/**
 * ============================================================================
 * 2. MOTOR DE AUDIO BLUETOOTH (Mezcla sobre Spotify y Honda RoadSync)
 * ============================================================================
 */
function initAudioEngine() {
  if (!audioCtx) {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AudioContext();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
  // Keep-Alive ultrasónico cada 18s para que el intercomunicador no entre en reposo
  setInterval(() => {
    if (!systemRunning || !audioCtx) return;
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      gain.gain.value = 0.0008; // Inaudible pero mantiene abierto el canal A2DP/HFP
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.04);
    } catch (e) {}
  }, 18000);
}

function playOoonoBeep(pattern = 'RADAR') {
  if (!audioCtx) initAudioEngine();
  const now = audioCtx.currentTime;

  const tone = (freq, start, duration, wave = 'sawtooth') => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = wave;
    osc.frequency.setValueAtTime(freq, now + start);
    gain.gain.setValueAtTime(0.9, now + start);
    gain.gain.exponentialRampToValueAtTime(0.01, now + start + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now + start);
    osc.stop(now + start + duration);
  };

  if (pattern === 'RADAR') {
    // Doble pitido oficial OOONO
    tone(2450, 0, 0.13);
    tone(2450, 0.18, 0.13);
    tone(2850, 0.40, 0.22);
  } else if (pattern === 'OVERSPEED') {
    // Alerta urgente si vas por encima de la velocidad del radar
    tone(3100, 0, 0.11, 'square');
    tone(2100, 0.13, 0.11, 'square');
    tone(3100, 0.26, 0.11, 'square');
    tone(2100, 0.39, 0.16, 'square');
  } else if (pattern === 'HELI') {
    // Alerta aérea Pegasus / Trànsit
    tone(1100, 0, 0.14);
    tone(1750, 0.16, 0.14);
    tone(2650, 0.32, 0.26);
  }
}

function speakAlert(text, beepPattern = 'RADAR') {
  playOoonoBeep(beepPattern);
  setTimeout(() => {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const msg = new SpeechSynthesisUtterance(text);
      msg.lang = 'es-ES';
      msg.rate = 1.08;
      msg.pitch = 1.0;
      msg.volume = 1.0;
      window.speechSynthesis.speak(msg);
    }
  }, 600);
}

/**

 * 3. ARRANQUE DEL SISTEMA Y GPS DE ALTA PRECISIÓN CON CÁLCULO DE RUMBO

async function handleMainButton() {
  if (!systemRunning) {
    await startSystem();
  } else {
    reportIncident('MÓVIL', 'Radar Móvil');
  }
}

async function startSystem() {
  initAudioEngine();
  systemRunning = true;

  document.getElementById('statusDot').className = 'dot active';
  document.getElementById('statusText').innerText = 'GPS + Intercom Activo';
  document.getElementById('speedDisplay').innerText = '0';
  document.getElementById('speedUnit').innerText = 'KM/H';
  document.getElementById('alertTitle').innerText = 'Escaneando Ruta';
  document.getElementById('alertSub').innerText = 'Blitzer.de + SCT + Radar Aéreo Pegasus activos';

  if ('wakeLock' in navigator) {
    try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
  }

  // Re-adquirir WakeLock si cambias de app y vuelves
  document.addEventListener('visibilitychange', async () => {
    if (wakeLock !== null && document.visibilityState === 'visible') {
      try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
    }
  });

  speakAlert('OOONO Moto activado. Ruta vigilada.', 'RADAR');

  // Primera descarga inmediata de radares y helicópteros
  fetchLiveRadars(userLat, userLon);
  fetchHelicopters();

  if ('geolocation' in navigator) {
    navigator.geolocation.watchPosition(onGpsUpdate, onGpsError, {
      enableHighAccuracy: true,
      maximumAge: 1000,
      timeout: 8000
    });
  }

  setInterval(fetchHelicopters, 15000);
}

function onGpsUpdate(pos) {
  const newLat = pos.coords.latitude;
  const newLon = pos.coords.longitude;
  currentSpeed = pos.coords.speed ? Math.round(pos.coords.speed * 3.6) : 0;
  document.getElementById('speedDisplay').innerText = currentSpeed;

  // Obtener rumbo del chip GPS o calcularlo respecto al punto anterior si nos movemos
  if (pos.coords.heading !== null && !isNaN(pos.coords.heading) && currentSpeed > 5) {
    userHeading = pos.coords.heading;
  } else if (prevLat !== null && calcDistance(prevLat, prevLon, newLat, newLon) > 6) {
    userHeading = calcBearing(prevLat, prevLon, newLat, newLon);
  }

  prevLat = userLat;
  prevLon = userLon;
  userLat = newLat;
  userLon = newLon;

  // Actualizar bases de datos en directo cada 2 km de avance
  const distFromLastFetch = calcDistance(userLat, userLon, lastFetchCoords.lat, lastFetchCoords.lon);
  if (distFromLastFetch > 2000) {
    lastFetchCoords = { lat: userLat, lon: userLon };
    fetchLiveRadars(userLat, userLon);
    fetchHelicopters();
  }

  checkProximityAlerts();
}

function onGpsError(err) {
  document.getElementById('statusDot').className = 'dot warn';
  if (window.location.protocol === 'content:' || window.location.protocol === 'file:') {
    document.getElementById('alertTitle').innerText = '⚠️ Súbelo a GitHub Pages';
    document.getElementById('alertSub').innerText = 'Android bloquea el GPS en archivos locales sueltos.';
  } else {
    document.getElementById('alertSub').innerText = 'Buscando satélites GPS...';
  }
}

/**
 * ============================================================================
 * 4. DESCARGA EN TIEMPO REAL: BLITZER.DE (Doble Proxy) + OPENSTREETMAP
 * ============================================================================
 */
async function fetchWithFallbackProxy(targetUrl) {
  const proxies = [
    `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`,
    `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`
  ];
  for (const p of proxies) {
    try {
      const r = await fetch(p, { signal: AbortSignal.timeout(6000) });
      if (r.ok) return await r.json();
    } catch (e) {}
  }
  return null;
}

async function fetchLiveRadars(lat, lon) {
  const delta = 0.12; // ~13 km a la redonda
  const minLat = (lat - delta).toFixed(5);
  const maxLat = (lat + delta).toFixed(5);
  const minLon = (lon - delta).toFixed(5);
  const maxLon = (lon + delta).toFixed(5);

  // Limpiar reportes antiguos (> 4 horas)
  const fourHoursAgo = Date.now() - (4 * 3600 * 1000);
  customReports = customReports.filter(r => !r.ts || r.ts > fourHoursAgo);

  let combined = [...CATALUNYA_STATIC_RADARS, ...customReports];

  // A) Blitzer.de / Atudo.net (Radares móviles, controles, furgonetas y fijos)
  const blitzerUrl = `https://cdn2.atudo.net/api/4.0/pois.php?type=0,1,2,3,4,5,6,101,102,103,104,105,106,107&box=${minLat},${minLon},${maxLat},${maxLon}`;
  const blitzerData = await fetchWithFallbackProxy(blitzerUrl);
  if (blitzerData && blitzerData.pois) {
    blitzerData.pois.forEach(p => {
      const isMobile = parseInt(p.type) < 50;
      combined.push({
        id: 'blz-' + p.id,
        lat: parseFloat(p.lat),
        lon: parseFloat(p.lng),
        vmax: parseInt(p.vmax) || 0,
        type: isMobile ? 'MÓVIL' : 'FIJO',
        name: isMobile ? 'Radar Móvil (Blitzer.de)' : 'Radar Fijo'
      });
    });
  }

  // B) OpenStreetMap Overpass API en directo
  try {
    const overpassQuery = `[out:json][timeout:8];node["highway"="speed_camera"](${minLat},${minLon},${maxLat},${maxLon});out body;`;
    const osmRes = await fetch(`https://overpass-api.de/api/interpreter?data=${encodeURIComponent(overpassQuery)}`);
    if (osmRes.ok) {
      const osmData = await osmRes.json();
      osmData.elements.forEach(el => {
        combined.push({
          id: 'osm-' + el.id,
          lat: el.lat,
          lon: el.lon,
          vmax: el.tags && el.tags.maxspeed ? parseInt(el.tags.maxspeed) : 0,
          type: 'FIJO',
          name: (el.tags && el.tags.name) ? el.tags.name : 'Radar Fijo SCT/OSM'
        });
      });
    }
  } catch (e) {}

  // Eliminar duplicados que estén a menos de 45 metros entre sí
  const deduplicated = [];
  combined.forEach(item => {
    const exists = deduplicated.some(existing => calcDistance(item.lat, item.lon, existing.lat, existing.lon) < 45);
    if (!exists) deduplicated.push(item);
  });

  activePois = deduplicated;
  updateCounterUI();
}

/**
 * ============================================================================
 * 5. ESCÁNER AÉREO ADS-B (Helicópteros Trànsit / Mossos / Pegasus)
 * ============================================================================
 */
async function fetchHelicopters() {
  if (!systemRunning) return;
  try {
    const url = `https://api.airplanes.live/v2/point/${userLat.toFixed(4)}/${userLon.toFixed(4)}/15`;
    const res = await fetch(url);
    if (!res.ok) return;
    const data = await res.json();
    const detected = [];

    if (data && data.ac) {
      data.ac.forEach(ac => {
        if (!ac.lat || !ac.lon) return;
        const altMeters = (ac.alt_baro || 0) * 0.3048;
        const speedKmh = (ac.gs || 0) * 1.852;
        const callsign = (ac.flight || '').toUpperCase().trim();
        const type = (ac.t || '').toUpperCase().trim();

        const isHeliModel = ['AS55', 'EC35', 'H135', 'EC45', 'B06', 'R44', 'A109', 'EC30'].includes(type);
        const isPoliceCall = callsign.includes('DGT') || callsign.includes('MOSSOS') || callsign.includes('TRANSIT') || callsign.includes('POL');
        const isSurveillanceFlight = (altMeters > 110 && altMeters < 920 && speedKmh > 35 && speedKmh < 215);

        if (isHeliModel || isPoliceCall || isSurveillanceFlight) {
          detected.push({
            id: 'heli-' + ac.hex,
            lat: ac.lat,
            lon: ac.lon,
            alt: Math.round(altMeters),
            speed: Math.round(speedKmh),
            callsign: callsign || type || 'Vuelo Bajo'
          });
        }
      });
    }
    activeHelis = detected;
    updateCounterUI();
  } catch (e) {}
}

/**
 * ============================================================================
 * 6. MOTOR INTELIGENTE DE PROXIMIDAD Y CONO DE DIRECCIÓN (EVITA FALSAS ALARMAS)
 * ============================================================================
 */
function checkProximityAlerts() {
  const now = Date.now();
  const warnDistance = currentSpeed > 75 ? 650 : 380;

  let closestAheadRadar = null;
  let minAheadDist = 99999;

  activePois.forEach(poi => {
    const d = calcDistance(userLat, userLon, poi.lat, poi.lon);
    const prevD = prevDistanceMap.get(poi.id) || d;
    prevDistanceMap.set(poi.id, d);

    // Comprobar si el radar está dentro de nuestro cono frontal de marcha (±55 grados)
    let isAhead = true;
    if (userHeading !== null && currentSpeed > 12 && d > 60) {
      const bearingToPoi = calcBearing(userLat, userLon, poi.lat, poi.lon);
      const angleDiff = Math.abs(((bearingToPoi - userHeading + 540) % 360) - 180);
      isAhead = angleDiff <= 55;
    }

    // Si ya nos estamos alejando claramente después de pasarlo (<150m), callar al instante
    const isMovingAway = (d > prevD + 3) && d < 180;

    if (isAhead && !isMovingAway && d < minAheadDist) {
      minAheadDist = d;
      closestAheadRadar = poi;
    }
  });

  // Revisar Helicópteros (< 4.5 km, sin importar rumbo porque se mueven desde el cielo)
  let closestHeli = null;
  let minHeliDist = 99999;
  activeHelis.forEach(h => {
    const d = calcDistance(userLat, userLon, h.lat, h.lon);
    if (d < minHeliDist) {
      minHeliDist = d;
      closestHeli = h;
    }
  });

  const ring = document.getElementById('ledRing');
  const badge = document.getElementById('limitBadge');

  // 1. ALERTA DE RADAR EN TU DIRECCIÓN
  if (closestAheadRadar && minAheadDist <= warnDistance) {
    const distRounded = Math.max(10, Math.round(minAheadDist / 10) * 10);
    const isOverspeed = closestAheadRadar.vmax > 0 && currentSpeed > (closestAheadRadar.vmax + 2);

    if (closestAheadRadar.type === 'MÓVIL') {
      ring.className = isOverspeed ? 'led-ring flash-red' : 'led-ring flash-blue';
    } else {
      ring.className = isOverspeed ? 'led-ring flash-red' : 'led-ring flash-orange';
    }

    document.getElementById('alertTitle').innerText = `⚠️ ${closestAheadRadar.type} A ${distRounded}m`;
    document.getElementById('alertSub').innerText = closestAheadRadar.name;

    if (closestAheadRadar.vmax > 0) {
      badge.style.display = 'flex';
      badge.innerText = closestAheadRadar.vmax;
    } else {
      badge.style.display = 'none';
    }

    const lastAlert = alertedIds.get(closestAheadRadar.id) || 0;
    if (now - lastAlert > 85000) {
      alertedIds.set(closestAheadRadar.id, now);
      const limitStr = closestAheadRadar.vmax > 0 ? `, límite ${closestAheadRadar.vmax}` : '';
      const pattern = isOverspeed ? 'OVERSPEED' : 'RADAR';
      speakAlert(`Atención, radar ${closestAheadRadar.type.toLowerCase()} a ${distRounded} metros${limitStr}`, pattern);
    }
    return;
  }

  // 2. ALERTA DE HELICÓPTERO DE TRÀNSIT / PEGASUS
  if (closestHeli && minHeliDist <= 4500) {
    const kmDist = (minHeliDist / 1000).toFixed(1);
    ring.className = 'led-ring flash-purple';
    badge.style.display = 'none';
    document.getElementById('alertTitle').innerText = `🚁 HELICÓPTERO A ${kmDist} KM`;
    document.getElementById('alertSub').innerText = `Alt: ${closestHeli.alt}m | Vel: ${closestHeli.speed} km/h (${closestHeli.callsign})`;

    const lastHeliAlert = alertedIds.get(closestHeli.id) || 0;
    if (now - lastHeliAlert > 120000) {
      alertedIds.set(closestHeli.id, now);
      speakAlert(`Alerta aérea. Helicóptero detectado a ${kmDist} kilómetros, altitud ${closestHeli.alt} metros.`, 'HELI');
    }
    return;
  }

  // 3. RUTA DESPEJADA
  ring.className = 'led-ring';
  badge.style.display = 'none';
  if (closestAheadRadar && minAheadDist < 12000) {
    document.getElementById('alertTitle').innerText = 'Ruta Despejada';
    document.getElementById('alertSub').innerText = `Próximo en ruta: ${(minAheadDist / 1000).toFixed(1)} km (${closestAheadRadar.name})`;
  } else {
    document.getElementById('alertTitle').innerText = 'Ruta Vigilada';
    document.getElementById('alertSub').innerText = 'Sin radares ni helicópteros próximos en tu sentido';
  }
}

/**
 * ============================================================================
 * 7. REPORTES CON UN TOQUE, MODO BOLSILLO Y GEOMETRÍA GPS
 * ============================================================================
 */
function reportIncident(type, label) {
  if (!systemRunning) startSystem();
  const newPoi = {
    id: 'usr-' + Date.now(),
    lat: userLat,
    lon: userLon,
    vmax: currentSpeed > 20 ? Math.round(currentSpeed / 10) * 10 : 80,
    type: type,
    name: `${label} (Reportado en Ruta)`,
    ts: Date.now()
  };
  customReports.push(newPoi);
  localStorage.setItem('ooono_custom_reports', JSON.stringify(customReports));
  activePois.push(newPoi);
  updateCounterUI();
  speakAlert(`${label} guardado en este punto.`, type === 'HELI' ? 'HELI' : 'RADAR');
}

function testIntercomAudio() {
  if (!systemRunning) startSystem();
  const ring = document.getElementById('ledRing');
  ring.className = 'led-ring flash-red';
  document.getElementById('limitBadge').style.display = 'flex';

let pocketMode = false;
function togglePocketMode() {
  pocketMode = !pocketMode;
  document.body.style.opacity = pocketMode ? '0.1' : '1';
  speakAlert(pocketMode ? 'Modo bolsillo activado' : 'Pantalla encendida', 'RADAR');
}

function updateCounterUI() {
  document.getElementById('dbCounter').innerText = `📍 ${activePois.length} | 🚁 ${activeHelis.length}`;
}

function calcDistance(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon / 2) * Math.sin(dLon / 2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function calcBearing(lat1, lon1, lat2, lon2) {
  const φ1 = lat1 * Math.PI / 180;
  const φ2 = lat2 * Math.PI / 180;
  const Δλ = (lon2 - lon1) * Math.PI / 180;
  const y = Math.sin(Δλ) * Math.cos(φ2);
  const x = Math.cos(φ1) * Math.sin(φ2) - Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
  return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
}

window.addEventListener('load', () => {
  activePois = [...CATALUNYA_STATIC_RADARS, ...customReports];
  updateCounterUI();
  if (window.location.search.includes('auto=1')) {
    setTimeout(() => startSystem(), 700);
  }
});
